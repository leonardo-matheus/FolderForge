<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Folder Base -->
  <path d="M45 70 L45 145 C45 150 50 155 55 155 L145 155 C150 155 155 150 155 145 L155 80 C155 75 150 70 145 70 L100 70 L90 55 C88 52 84 50 80 50 L55 50 C50 50 45 55 45 60 L45 70 Z" 
        fill="#ffffff" opacity="0.95"/>
  
  <!-- Folder Tab -->
  <path d="M45 70 L90 70 L80 55 C78 52 74 50 70 50 L55 50 C50 50 45 55 45 60 Z" 
        fill="#e2e8f0"/>
  
  <!-- Organization Lines -->
  <g transform="translate(60, 85)">
    <!-- Line 1 with number -->
    <rect x="0" y="0" width="15" height="12" rx="3" fill="url(#grad2)"/>
    <text x="7.5" y="9" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white" text-anchor="middle">01</text>
    <rect x="20" y="3" width="55" height="6" rx="2" fill="#cbd5e1"/>
    
    <!-- Line 2 with number -->
    <rect x="0" y="20" width="15" height="12" rx="3" fill="url(#grad2)"/>
    <text x="7.5" y="29" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white" text-anchor="middle">02</text>
    <rect x="20" y="23" width="45" height="6" rx="2" fill="#cbd5e1"/>
    
    <!-- Line 3 with number -->
    <rect x="0" y="40" width="15" height="12" rx="3" fill="url(#grad2)"/>
    <text x="7.5" y="49" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white" text-anchor="middle">03</text>
    <rect x="20" y="43" width="50" height="6" rx="2" fill="#cbd5e1"/>
  </g>
  
  <!-- Sparkle/Magic Effect -->
  <g fill="#fbbf24">
    <circle cx="155" cy="55" r="4"/>
    <circle cx="165" cy="65" r="2.5"/>
    <circle cx="145" cy="48" r="2"/>
  </g>
  
  <!-- Arrow indicating organization -->
  <path d="M160 110 L175 100 L175 105 L185 105 L185 115 L175 115 L175 120 Z" 
        fill="url(#grad2)" opacity="0.8"/>
</svg>
